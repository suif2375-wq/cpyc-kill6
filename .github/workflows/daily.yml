name: 福彩3D排列3排列5双色球每日更新

on:
  push:
    branches: [main]   # 代码变更推送后立即构建并部署 Pages
  schedule:
    # 北京时间 21:16、21:26、21:30、22:00（GitHub Actions 使用 UTC）。
    # GitHub 的定时任务可能延迟或漏触发，22:20、22:40、23:00 再做三次兜底检查。
    # 只在发现新期号时提交，重复运行不会产生空提交。
    - cron: '16 13 * * *'
    - cron: '26 13 * * *'
    - cron: '30 13 * * *'
    - cron: '0 14 * * *'
    - cron: '20 14 * * *'
    - cron: '40 14 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:  # 手动触发

concurrency:
  group: lottery-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: 设置 Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false

      - name: 构建
        run: go build -o fc3d-kill6 .

      - name: 运行云端更新
        run: ./fc3d-kill6

      - name: 提交变更
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add fc3d-history.csv p3-history.csv p5-history.csv ssq-history.csv p3-recommend-history.json p5-recommend-history.json index.html kill6_history.json
          if git diff --cached --quiet; then
            echo "无变更"
          else
            git commit -m "自动更新 $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M') [skip ci]"
            # 延迟的 schedule 可能与其他运行重叠；推送前同步最新 main，冲突时重试。
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "连续 3 次推送失败"
                exit 1
              fi
              sleep $((attempt * 5))
            done
          fi

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
          name: github-pages

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
