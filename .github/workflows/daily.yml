name: 福彩3D排列3排列5双色球每日更新

on:
  push:
    branches: [main]   # 代码变更推送后立即构建并部署 Pages
  schedule:
    # 北京时间 21:16、21:26、21:30、22:00（GitHub Actions 使用 UTC）。
    # 只在发现新期号时提交，重复运行不会产生空提交。
    - cron: '16 13 * * *'
    - cron: '26 13 * * *'
    - cron: '30 13 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:  # 手动触发

concurrency:
  group: lottery-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - name: 构建
        run: go build -o fc3d-kill6 .

      - name: 运行云端更新
        run: ./fc3d-kill6

      - name: 提交变更
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add fc3d-history.csv p3-history.csv p5-history.csv ssq-history.csv index.html kill6_history.json
          if git diff --cached --quiet; then
            echo "无变更"
          else
            git commit -m "自动更新 $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M') [skip ci]"
            git push origin main
          fi

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          name: github-pages

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
